{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1>{% if request.query_params.get('error') %}<div class="alert">{{request.query_params.get('error')}}</div>{% endif %}<form method="post"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn">Create Account</button></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}
