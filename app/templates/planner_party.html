{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">SMART PLANNER</p><h1>Party Budget Planner</h1><p class="muted">Set your guest count and event context so the budget can be allocated.</p></div></div><form class="card planner-form" method="post" action="/generate-party"><div class="form-grid"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Guest count<input type="number" name="guests" min="1" value="20" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Gathering</option></select></label><label>Venue preference<input name="venue" required placeholder="Restaurant, hall, home..."></label><label>City<input name="city" value="Chennai"></label></div><button class="btn">Generate Recommendations ✨</button></form>{% endblock %}
