{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">SMART PLANNER</p><h1>Jewelry Budget Planner</h1><p class="muted">Describe the occasion and style. Add an outfit image for multimodal analysis.</p></div></div><form class="card planner-form" method="post" action="/generate-jewelry" enctype="multipart/form-data"><div class="form-grid"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Party</option><option>Festival</option><option>Date Night</option></select></label><label>Style<input name="style" required placeholder="Elegant, traditional, minimal"></label><label>Outfit notes<textarea name="outfit_notes" placeholder="Color, neckline, fabric..."></textarea></label><label>Outfit image (optional)<input type="file" name="outfit_image" accept="image/png,image/jpeg,image/webp"></label></div><button class="btn">Generate Recommendations ✨</button></form>{% endblock %}
