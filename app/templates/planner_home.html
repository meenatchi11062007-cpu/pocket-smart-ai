{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">SMART PLANNER</p><h1>Home Interior Planner</h1><p class="muted">Tell us the room, style and items you want to prioritize.</p></div></div><form class="card planner-form" method="post" action="/generate-home"><div class="form-grid"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Room type<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option></select></label><label>Style<input name="style" required placeholder="Modern, minimal"></label><label>Items to consider<textarea name="items" required placeholder="Sofa, lights, rug, storage..."></textarea></label><label>Location<input name="location" value="India"></label></div><button class="btn">Generate Recommendations ✨</button></form>{% endblock %}
